<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Edit book</title>
    <style type="text/css">
        body {
            padding: 10px;
        }

        label {
            display: inline-block;
            width: 100px;
        }

        input:read-only {
            background: lightgray;
        }

        .row {
            margin-top: 10px;
        }
    </style>
</head>
<body>

<!-- Book edition -->
<form action="edit_book.html" id="edit-form"
      method="post"
      th:action="${book.id == null} ? @{/save} : @{/update(id=${book.id})}"
      th:object="${book}">
    <!--      th:action="@{/edit(id=${book.id})}"-->


    <h3>Информация о книге:</h3>

    <div th:if="*{id} != null">
        <label for="id-input">ID:</label>
        <input id="id-input" readonly="readonly" th:value="*{id}" type="text" value="1"/>
    </div>

    <div>
        <label for="book-title-input">Название:</label>
        <input id="book-title-input" name="title" th:value="*{title}" type="text" value="Default Title"/>
    </div>

    <div>
        <label for="author-select">Автор:</label>
        <select id="author-select" th:field="*{author.id}">
            <option th:each="a : ${authors}"
                    th:text="${a.fullName}"
                    th:value="${a.id}">
            </option>
        </select>
    </div>
    <div>
        <label for="genre-select">Genres:</label>
        <select id="genre-select" multiple name="genreIds">
            <option th:each="g : ${genres}"
                    th:selected="${book.genres != null && book.genres.![id].contains(g.id)}"
                    th:text="${g.name}"
                    th:value="${g.id}">
            </option>
        </select>
        <div class="errors" th:errors="*{genres}" th:if="${#fields.hasErrors('genres')}"></div>
    </div>
    <div class="row">
        <button type="submit">Сохранить</button>
        <a href="books_overview.html" th:href="@{/}">
            <button type="button">Отмена</button>
        </a>
    </div>
</form>

</body>
</html>
